nodeLinker: node-modules
enableTelemetry: false

# Private packages under this scope come from GitHub Packages. Never put tokens here:
# Dependabot authenticates with the registry defined in .github/dependabot.yml, and
# developers keep their own token in ~/.yarnrc.yml.
npmScopes:
  private-example:
    npmRegistryServer: 'https://npm.pkg.github.com'
