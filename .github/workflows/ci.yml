name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn test

  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn synth
      - uses: actions/upload-artifact@v4
        with:
          name: cdk-out
          path: cdk.out/

  verify-synth:
    needs: synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          name: cdk-out
          path: cdk.out/
      - run: test -f cdk.out/manifest.json

  # Stand-in for any CI step that needs a credential (integration tests, a preview deploy).
  # Workflows triggered by Dependabot only get Dependabot secrets, so INTEGRATION_API_TOKEN
  # must exist as an Actions secret AND as a Dependabot secret for this job to pass everywhere.
  integration-token:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the integration token is available
        env:
          INTEGRATION_API_TOKEN: ${{ secrets.INTEGRATION_API_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$INTEGRATION_API_TOKEN" ]; then
            echo "::error::INTEGRATION_API_TOKEN is not available to this run (actor: $ACTOR). If this is a Dependabot PR, add the same secret under Settings > Secrets and variables > Dependabot."
            exit 1
          fi
          echo "INTEGRATION_API_TOKEN is available (actor: $ACTOR)."
